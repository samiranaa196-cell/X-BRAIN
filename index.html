<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <meta name="theme-color" content="#ffffff">

  <meta name="description"
        content="X-BRAIN — Your friendly AI assistant">

  <link rel="manifest" href="/manifest.json">

  <link rel="icon"
        href="/icon.svg"
        type="image/svg+xml">

  <link rel="stylesheet" href="/style.css">

  <title>X-BRAIN AI Assistant</title>
</head>

<body>

  <div id="app">

    <header class="app-header">
      <div class="brand">
        <img src="/icon.svg"
             alt="X-BRAIN"
             class="app-icon">

        <div class="brand-text">
          <h1>X-BRAIN</h1>
          <p>AI Assistant</p>
        </div>
      </div>
    </header>

    <main class="chat-container">

      <div id="chatMessages" class="chat-messages">

        <div class="message ai-message">
          <div class="message-icon">
            <img src="/icon.svg" alt="AI">
          </div>

          <div class="message-content">
            <strong>X-BRAIN</strong>
            <p>
              Hello! 👋 I'm X-BRAIN, your friendly AI assistant.
            </p>
          </div>
        </div>

      </div>

    </main>

    <div class="input-area">

      <div class="input-box">

        <textarea
          id="userInput"
          placeholder="Ask X-BRAIN anything..."
          rows="1"
          autocomplete="off"
        ></textarea>

        <button id="sendButton" type="button">
          ➤
        </button>

      </div>

    </div>

  </div>

  <script src="/app.js"></script>
  <script src="/offline.js"></script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js")
          .then(() => {
            console.log("X-BRAIN Service Worker registered");
          })
          .catch((error) => {
            console.log("Service Worker error:", error);
          });
      });
    }
  </script>

</body>
</html>
